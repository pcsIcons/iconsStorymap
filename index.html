<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harris County Pollution Control Social Links</title>

<style>

body{
    margin:0;
    padding:10px;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
}

.footer-container{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
}

.social-btn{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#003A70;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #ffffff;
    transition:all .25s ease;
    box-shadow:0 2px 4px rgba(0,0,0,.15);
}

.social-btn:hover{
    background:#4A8B2C;
    transform:translateY(-3px);
    box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.social-btn img{
    width:26px;
    height:26px;
}

a{
    text-decoration:none;
}

</style>
</head>

<body>

<div class="footer-container">

    <!-- Instagram -->
    <a href="https://www.instagram.com/harriscopc/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
        <div class="social-btn">
            <img src="icons/instagram.png" alt="Instagram">
        </div>
    </a>

    <!-- Threads -->
    <a href="https://www.threads.com/@harriscopc"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Threads">
        <div class="social-btn">
            <img src="icons/threads.png" alt="Threads">
        </div>
    </a>

    <!-- Facebook -->
    <a href="https://www.facebook.com/HarrisCoPollutionControl"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Facebook">
        <div class="social-btn">
            <img src="icons/facebook.png" alt="Facebook">
        </div>
    </a>

    <!-- X -->
    <a href="https://x.com/HarrisCoPC"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="X">
        <div class="social-btn">
            <img src="icons/x.png" alt="X">
        </div>
    </a>

    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/company/harris-county-pollution-control-services"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="LinkedIn">
        <div class="social-btn">
            <img src="icons/linkedin.png" alt="LinkedIn">
        </div>
    </a>

    <!-- YouTube -->
    <a href="https://www.youtube.com/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="YouTube">
        <div class="social-btn">
            <img src="icons/youtube.png" alt="YouTube">
        </div>
    </a>

    <!-- TikTok -->
    <a href="https://www.tiktok.com/@hcpcstx"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="TikTok">
        <div class="social-btn">
            <img src="icons/tiktok.png" alt="TikTok">
        </div>
    </a>

    <!-- Nextdoor -->
    <a href="https://nextdoor.com/agency-detail/tx/pasadena/harris-county-pollution-control-services/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Nextdoor">
        <div class="social-btn">
            <img src="icons/nextdoor.png" alt="Nextdoor">
        </div>
    </a>

    <!-- Website -->
    <a href="https://pcs.harriscountytx.gov/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Website">
        <div class="social-btn">
            <img src="icons/website.png" alt="Website">
        </div>
    </a>

</div>

</body>
</html>
