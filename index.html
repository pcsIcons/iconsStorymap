<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harris County Pollution Control Social Links</title>

<style>
body{
    margin:0;
    padding:10px;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
}

.footer-container{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
}

.social-btn{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#003A70;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #ffffff;
    transition:all .25s ease;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
}

.social-btn:hover{
    background:#4A8B2C;
    transform:translateY(-3px);
    box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.social-btn img{
    width:30px;
    height:30px;
    filter: brightness(0) invert(1);
}

a{
    text-decoration:none;
}
</style>
</head>

<body>

<div class="footer-container">

    <a href="https://www.instagram.com/harriscopc/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram">
        <div class="social-btn">
            <img src="instagram.png" alt="Instagram">
        </div>
    </a>

    <a href="https://www.facebook.com/HarrisCoPollutionControl"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Facebook">
        <div class="social-btn">
            <img src="facebook.png" alt="Facebook">
        </div>
    </a>

    <a href="https://x.com/HarrisCoPC"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="X">
        <div class="social-btn">
            <img src="x.png" alt="X">
