<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harris County Pollution Control Services Social Media</title>

<style>
body {
    margin: 0;
    padding: 20px 10px;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

.footer-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
}

.social-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #003A70;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #ffffff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    transition: all 0.25s ease;
    cursor: pointer;
}

.social-btn:hover {
    background: #4A8B2C;
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 5px 12px rgba(0,0,0,0.3);
}

.social-btn img {
    width: 32px;
    height: 32px;
    filter: brightness(0) invert(1);
}

a {
    text-decoration: none;
}
</style>
</head>

<body>

<div class="footer-container">

    <!-- Instagram -->
    <a href="https://www.instagram.com/harriscopc/"
       target="_blank"
       rel="noopener noreferrer"
       onclick="window.open(this.href,'_blank'); return false;"
       aria-label="Instagram">
        <div class="social-btn">
            <img src="instagram.png" alt="Instagram">
        </div>
    </a>

    <!-- Facebook -->
    <a href="https://www.facebook.com/HarrisCoPollutionControl"
       target="_blank"
       rel="noopener noreferrer"
       onclick="window.open(this.href,'_blank'); return false;"
       aria-label="Facebook">
        <div class="social-btn">
            <img src="facebook.png" alt="Facebook">
        </div>
    </a>

    <!-- X -->
    <a href="https://x.com/HarrisCoPC"
       target="_blank"
       rel="noopener noreferrer"
       onclick="window.open(this.href,'_blank'); return false;"
       aria-label="X">
        <div class="social-btn">
            <img src="x.png" alt="X">
        </div>
    </a>

    <!-- YouTube -->
    <a href="https://www.youtube.com/"
       target="_blank"
       rel="noopener noreferrer"
       onclick="window.open(this.href,'_blank'); return false;"
       aria-label="YouTube">
        <div class="social-btn">
            <img src="youtube.png" alt="YouTube">
        </div>
    </a>

</div>

</body>
</html>
