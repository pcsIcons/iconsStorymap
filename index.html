<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harris County Pollution Control Social Links</title>

<style>
body{
    margin:0;
    padding:10px;
    background:transparent;
    font-family:Arial, Helvetica, sans-serif;
}

.footer-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}

.social-btn{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#003A70;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid #ffffff;
}

.social-btn img{
    width:26px;
    height:26px;
}
</style>
</head>

<body>

<div class="footer-container">

    <a href="https://www.instagram.com/harriscopc/" target="_blank">
        <div class="social-btn">
            <img src="instagram.png" alt="Instagram">
        </div>
    </a>

    <a href="https://www.facebook.com/HarrisCoPollutionControl" target="_blank">
        <div class="social-btn">
            <img src="facebook.png" alt="Facebook">
        </div>
    </a>

    <a href="https://x.com/HarrisCoPC" target="_blank">
        <div class="social-btn">
            <img src="x.png" alt="X">
        </div>
    </a>

    <a href="https://www.youtube.com/" target="_blank">
        <div class="social-btn">
            <img src="youtube.png" alt="YouTube">
        </div>
    </a>

</div>

</body>
</html>
